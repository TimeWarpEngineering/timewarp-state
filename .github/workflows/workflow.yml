name: CI/CD Pipeline

# Thin trigger. Pipeline lives in C# (`dev workflow`).
# PR/merge: classify → assert-version-ssot → clean → build → test → e2e → verify-samples.
# verify-samples packs, then restores sample 00 auto. Other samples are project references.
# Release: promote CI Packages-* artifact (no rebuild). Docs job deferred.
# Fast path (task 150, task 162): when `dev ci` already passed on HEAD, the PR head, or a merge parent
# whose tree equals HEAD's tree outside the top-level kanban/ entry, the gate step restores its
# packages and the pipeline step is skipped. See documentation/dev-ops/local-ci.md.
on:
  # No paths filter on pull_request: every pull request reports CI (the org
  # one-workflow CI standard, ganda 655). dev workflow asks the shared
  # PullRequestBuildClassifier (TimeWarp.Nuru.DevCli) whether to build; a pull
  # request that changes only non-build paths (kanban, docs, ...) exits 0 early.
  pull_request:
  push:
    branches: [master]
    # Keep the push filter: a kanban-only or docs-only merge to master must not
    # rebuild and upload a Packages-* artifact that release would promote.
    paths:
      - 'source/**'
      - 'tests/**'
      - 'samples/**'
      - 'scripts/**'
      - 'tools/**'
      - 'msbuild/**'
      - '.github/workflows/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'timewarp-state.slnx'
      - 'readme.md'
      - 'assets/logo.png'
      - '*.props'
      - '*.targets'
      - 'nuget.config'
      - 'global.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode. merge = build and test only (default). release = break-glass publish; also requires confirm. probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - release
          - probe
        default: merge
      confirm:
        description: 'Break-glass guard: type the word release to confirm publishing when mode is release. Ignored otherwise.'
        type: string
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate break-glass confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm != 'release'
        run: |
          echo "::error::mode=release requires confirm=release. Refusing to run a break-glass release."
          exit 1

      - name: NuGet login (OIDC Trusted Publishing)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: echo "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)"

      - name: Local CI fast path
        # Pull request and push only. Reads the unsigned dev ci note on refs/notes/ganda-ci for the
        # first candidate commit with one: HEAD, the PR head (pull_request), then each merge parent
        # (push; the PR head is parent 2), each followed by its first-parent ancestors (up to 10),
        # because ganda task work pushes kanban-only land-pr commits after dev ci ran (task 163). The
        # commit's tree must equal HEAD's tree once the top-level kanban entry is removed from both,
        # because master lands kanban commits before the merge (task 162); a chain stops at the first
        # tree that differs outside kanban/. Then it checks stages, SDK, and RID, and restores the attested nupkgs from
        # refs/ci-packages/<tree> into artifacts/packages. Any miss prints why, stays green, and
        # leaves fast_path unset, so the full pipeline below runs as before.
        id: fastpath
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          CI_FAST_PATH_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci-fast-path-gate.ps1

      - name: Run CI Pipeline
        id: pipeline
        if: >-
          steps.fastpath.outputs.fast_path != 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.mode != 'probe')
        env:
          GH_TOKEN: ${{ github.token }}
          UseHttp: "true"
          # dev workflow reads the key from NUGET_API_KEY so it stays off the dev argv. Empty outside release.
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            dotnet run --file tools/dev-cli/dev.cs -- workflow
          } elseif ("${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.confirm == 'release' }}" -eq 'true') {
            dotnet run --file tools/dev-cli/dev.cs -- workflow --mode release
          } else {
            dotnet run --file tools/dev-cli/dev.cs -- workflow
          }

      - name: coverage
        # Cobertura from the e2e dotnet test (--collect:"XPlat Code Coverage",
        # results directory artifacts/coverage). Release and probe never reach this
        # step. A missing file means that test run wrote nothing, so the job fails.
        # A pull request the classifier skipped (requires_build=false) has no coverage.
        # The local CI fast path skips the pipeline, so it has no coverage either (RFC resolution 7).
        if: >-
          success() &&
          steps.fastpath.outputs.fast_path != 'true' &&
          steps.pipeline.outputs.requires_build != 'false' &&
          github.event_name != 'release' &&
          !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'probe'))
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/coverage
          if-no-files-found: error

      - name: Upload Artifacts
        # Skip release (promote the already-uploaded merge artifact) and probe
        # (pipeline is skipped, so artifacts/packages is empty), and a pull request
        # the classifier skipped (requires_build=false, nothing packed). On the local CI fast path the
        # gate restored the attested nupkgs into artifacts/packages and requires_build is unset.
        if: >-
          success() &&
          steps.pipeline.outputs.requires_build != 'false' &&
          github.event_name != 'release' &&
          !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'probe'))
        uses: actions/upload-artifact@v7
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
